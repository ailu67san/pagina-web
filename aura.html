<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CLOTHES CLUB - tu armario, tu estilo, tu mundo</title>

<style>
.imagen-fondo-fijada {
        position: fixed;   /* 👈 La fija a la pantalla */
        top: 0;
        left: 0;
        width: 100vw;      /* 👈 Ocupa todo el ancho de la ventana */
        height: 100vh;     /* 👈 Ocupa todo el alto de la ventana */
        
        /* 🔴 ESTA ES LA PROPIEDAD CLAVE PARA AGRANDARLA AL FONDO: */
        object-fit: cover; /* 👈 Escala la imagen para cubrir todo sin estirarla */
        
        object-position: center; /* Centra la imagen */
        z-index: -1;       /* 👈 La envía detrás de todo el contenido */
        pointer-events: none; /* Evita que los clics la toquen */
}
body {
        margin: 0;
        color: white;
        font-family: "Trebuchet MS", Arial, sans-serif;
        
        /* 🔴 MUY IMPORTANTE: Asegurate de no tener ningún color sólido aquí
           que pueda tapar la imagen. */
        background-color: transparent; 
    }

    /* =========================================
       3. TU ESTRUCTURA ACTUAL (CON TRANSPARENCIA)
    ========================================= */

    .page {
        width: 1100px;
        max-width: 96%;
        margin: 20px auto;
        border: 3px solid #8F4D75;
        
        /* 🔴 OTRA CLAVE: Usá rgba() con transparencia (0.9 = 90% opaco)
           para que la imagen de fondo se trasluzca. */
        background-color: rgba(175, 113, 157, 0.9);
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.4);
        position: relative; /* Asegura que el contenido esté sobre la imagen */
    }

    header {
        min-height: 180px;
        position: relative;
        text-align: center;
        padding: 30px 20px 20px;
        overflow: hidden;
        background-color: #BD5579;
        border-bottom: 2px solid #9C5480;
    }

    /* ... (resto de tus estilos para .content, .panel, etc.) ... */
    </style>
</head>

<body>

    <!-- ===================================================
       4. LA ETIQUETA IMG (DEBE IR ANTES DEL CONTENIDO)
    =================================================== -->
    <img src="fondo.jpg" class="imagen-fondo-fijada" alt="Fondo Retro">

    <!-- TU ESTRUCTURA PAGE ACTUAL -->
    <div class="page">
        <!-- (Tu contenido del header, main, etc.) -->
    </div>

</body>
</html>
